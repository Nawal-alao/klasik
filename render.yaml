# Render Blueprint — Évoly
#
# ⚠️ Ce fichier DOIT rester à la racine du dépôt : Render ne lit pas les
# blueprints placés dans un sous-dossier. `rootDir: backend` indique à
# Render que le service Django vit dans backend/.
#
# Déploiement : dashboard Render → New → Blueprint → sélectionner ce repo.
#
# 🔑 SECRETS À AJOUTER MANUELLEMENT après la création du service
#    (dashboard Render → evoly-api → Environment → Add Environment Variable),
#    jamais commités ici :
#      COHERE_API_KEY
#      DB_NAME, DB_USER, DB_PASSWORD, DB_HOST, DB_PORT   (Supabase)
#      AWS_S3_ENDPOINT_URL, AWS_STORAGE_BUCKET_NAME,
#      AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_REGION_NAME
#      CORS_ALLOWED_ORIGINS, CSRF_TRUSTED_ORIGINS        (après Vercel)

services:
  - type: web
    name: evoly-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn evoly.wsgi:application

    envVars:
      # Version de Python côté Render (alignée sur le dev local)
      - key: PYTHON_VERSION
        value: "3.14"

      # --- Non secrets ---
      - key: DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      # --- Secret généré automatiquement par Render (rotatable) ---
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Les autres variables (secrets + URLs Vercel) s'ajoutent dans le
      # dashboard — voir la liste en tête de fichier.
